<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TokoKita - Belanja Online Praktis</title>

  <!-- Tailwind CSS & Lucide Icons & Supabase -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col pb-24 md:pb-0">

  <!-- ==================== HEADER / TOPBAR SHOPEE STYLE ==================== -->
  <header class="sticky top-0 z-40 bg-orange-500 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchBuyerTab('shop')">
        <div class="w-9 h-9 rounded-xl bg-white text-orange-500 flex items-center justify-center font-black shadow-sm">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base tracking-tight leading-none">TokoKita</h1>
          <span class="text-[10px] text-orange-100 font-medium">Express & Terpercaya</span>
        </div>
      </div>

      <!-- Search Bar Desktop -->
      <div class="flex-1 max-w-xl hidden md:flex bg-white rounded-xl p-1 shadow-inner items-center">
        <input type="text" id="search-input" placeholder="Cari produk di TokoKita..." oninput="filterProducts()" 
               class="w-full px-3 py-1.5 text-xs text-slate-800 bg-transparent focus:outline-none">
        <button onclick="filterProducts()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition">
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Navigasi Kanan -->
      <div class="flex items-center gap-2">
        <button onclick="switchBuyerTab('orders')" class="hidden sm:flex items-center gap-1.5 px-3 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold transition">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          <span>Pesanan</span>
        </button>

        <button onclick="toggleCartModal(true)" class="relative p-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl transition shadow-sm">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-white text-orange-600 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-orange-500 shadow-sm hidden">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Search Bar Mobile -->
  <div class="md:hidden bg-orange-500 px-4 pb-3">
    <div class="bg-white rounded-xl p-1 flex items-center shadow-md">
      <input type="text" id="search-input-mobile" placeholder="Cari produk..." oninput="filterProductsMobile()" 
             class="w-full px-3 py-2 text-xs text-slate-800 bg-transparent focus:outline-none">
      <i data-lucide="search" class="w-4 h-4 text-orange-500 mr-2"></i>
    </div>
  </div>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full space-y-6">

    <!-- TAB 1: BERANDA / KATALOG -->
    <section id="tab-shop" class="space-y-6">
      
      <!-- Banner Promosi Ala Shopee -->
      <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 p-6 text-white shadow-lg">
        <div class="relative z-10 max-w-lg space-y-2">
          <span class="px-2.5 py-0.5 bg-white/20 text-white text-[10px] font-extrabold uppercase rounded-full">Flash Sale & Promo</span>
          <h2 class="text-2xl font-black">Gratis Ongkir & Diskon Setiap Hari!</h2>
          <p class="text-xs text-orange-100">Belanja kebutuhan harianmu dengan jaminan produk original dan pengiriman cepat.</p>
        </div>
      </div>

      <!-- Kategori Filter -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
        <button onclick="filterCategory('all')" class="category-chip active px-4 py-2 bg-orange-500 text-white rounded-xl text-xs font-bold whitespace-nowrap shadow-sm">Semua</button>
        <button onclick="filterCategory('elektronik')" class="category-chip px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-xl text-xs font-bold whitespace-nowrap">Elektronik</button>
        <button onclick="filterCategory('fashion')" class="category-chip px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-xl text-xs font-bold whitespace-nowrap">Fashion</button>
        <button onclick="filterCategory('gadget')" class="category-chip px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-xl text-xs font-bold whitespace-nowrap">Gadget</button>
      </div>

      <!-- Grid Produk -->
      <div class="flex items-center justify-between">
        <h3 class="font-extrabold text-sm text-slate-900 uppercase tracking-wider">Rekomendasi Produk</h3>
        <span id="product-count" class="text-xs font-bold text-slate-400">0 Produk</span>
      </div>

      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
        <!-- Render Produk -->
      </div>
    </section>

    <!-- TAB 2: PESANAN SAYA -->
    <section id="tab-orders" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900">Status Pesanan Saya</h2>
        <button onclick="fetchOrders()" class="text-xs text-orange-500 font-bold flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Muat Ulang
        </button>
      </div>
      <div id="buyer-orders-list" class="space-y-3">
        <!-- Render Pesanan -->
      </div>
    </section>

  </main>

  <!-- ==================== BOTTOM NAVIGATION (MOBILE) ==================== -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 flex justify-around py-3 px-2 shadow-lg">
    <button onclick="switchBuyerTab('shop')" id="nav-mobile-shop" class="flex flex-col items-center gap-1 text-orange-500 font-bold text-[10px]">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span>Beranda</span>
    </button>
    <button onclick="switchBuyerTab('orders')" id="nav-mobile-orders" class="flex flex-col items-center gap-1 text-slate-400 font-bold text-[10px]">
      <i data-lucide="clipboard-list" class="w-5 h-5"></i>
      <span>Pesanan</span>
    </button>
    <button onclick="toggleCartModal(true)" class="flex flex-col items-center gap-1 text-slate-400 font-bold text-[10px] relative">
      <i data-lucide="shopping-cart" class="w-5 h-5"></i>
      <span>Keranjang</span>
    </button>
  </div>

  <!-- ==================== MODAL KERANJANG (SHOPEE STYLE) ==================== -->
  <div id="modal-cart" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex justify-end hidden">
    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl animate-slide-left">
      <div class="p-4 bg-orange-500 text-white flex items-center justify-between">
        <h3 class="font-bold text-sm flex items-center gap-2">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i> Keranjang Belanjaanmu
        </h3>
        <button onclick="toggleCartModal(false)" class="text-white hover:text-orange-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="cart-items-container" class="flex-grow overflow-y-auto p-4 space-y-3">
        <!-- List Item Keranjang -->
      </div>

      <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium">Total Pembayaran</span>
          <span id="cart-total" class="text-lg font-black text-orange-600">Rp 0</span>
        </div>
        <button onclick="checkout()" class="w-full py-3.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold text-sm shadow-md transition flex items-center justify-center gap-2">
          <span>Buat Pesanan (Checkout)</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 z-50 space-y-2 pointer-events-none"></div>

  <script src="buyer.js"></script>
</body>
</html>
